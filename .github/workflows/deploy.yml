name: Despliegue

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Sin permisos de escritura sobre el repositorio
permissions:
  contents: read

# Un despliegue a la vez, y nunca se corta uno a medias
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar (lint, tipos y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  base-de-datos:
    name: Migraciones y función (Supabase)
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conectar con el proyecto en IPv4
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --network 4
      - name: Migraciones pendientes
        run: supabase db push --remote --dry-run
      - name: Aplicar migraciones
        run: supabase db push --remote
      - name: Publicar la función notify
        run: supabase functions deploy notify --project-ref "$SUPABASE_PROJECT_ID"

  app:
    name: App y proxy (Cloudflare)
    needs: base-de-datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Compilar
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Publicar en Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
