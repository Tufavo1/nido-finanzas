name: Despliegue

# Publica en producción lo que llega a main: primero las migraciones de la base (Supabase) y después
# la app y el proxy (Cloudflare). Nadie despliega desde su equipo ni desde un agente.
#
# Antes de usarlo, una sola vez, en GitHub:
#   1. Settings → Environments → crear «production» con «Required reviewers» (tú) y limitado a la rama main.
#   2. En ese environment, Secrets:
#        SUPABASE_ACCESS_TOKEN   token personal de Supabase (Account → Access Tokens)
#        SUPABASE_DB_PASSWORD    contraseña de la base de datos del proyecto
#        SUPABASE_PROJECT_ID     identificador del proyecto (las letras antes de .supabase.co)
#        CLOUDFLARE_API_TOKEN    token con permiso «Edit Cloudflare Workers» solo para esta cuenta
#        CLOUDFLARE_ACCOUNT_ID   identificador de la cuenta de Cloudflare
#      y Variables (son públicas, viajan en la app):
#        VITE_TURNSTILE_SITE_KEY, VITE_VAPID_PUBLIC_KEY, VITE_GOOGLE_CLIENT_ID
#   3. Si las migraciones anteriores se aplicaron a mano (pegando el SQL), hay que marcarlas como ya
#      aplicadas una vez, desde tu equipo: «supabase migration repair --status applied <versión>».
#      El paso «Migraciones pendientes» de abajo muestra qué intentaría aplicar; si lista migraciones
#      antiguas, detén la aprobación y repara el historial primero.
#
# Los secretos solo existen dentro del environment «production»: un pull request (propio o de un fork)
# no puede leerlos, y cada despliegue espera tu aprobación.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sin permisos de escritura sobre el repositorio
permissions:
  contents: read

# Un despliegue a la vez, y nunca se corta uno a medias
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar (lint, tipos y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  base-de-datos:
    name: Migraciones y función (Supabase)
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Migraciones pendientes
        run: supabase db push --remote --dry-run
      - name: Aplicar migraciones
        run: supabase db push --remote
      - name: Publicar la función notify
        run: supabase functions deploy notify --project-ref "$SUPABASE_PROJECT_ID"

  app:
    name: App y proxy (Cloudflare)
    needs: base-de-datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Compilar
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Publicar en Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}